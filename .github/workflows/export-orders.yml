name: Task
run-name: Task
permissions:
  contents: read

on:
  repository_dispatch:
    types: [export_orders]
  workflow_dispatch:
    inputs:
      from:
        description: 'Start (optional, YYYY-MM-DD)'
        type: string
      to:
        description: 'End (optional, YYYY-MM-DD)'
        type: string

concurrency:
  group: configured-task
  cancel-in-progress: false

jobs:
  task:
    name: Task
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize
        uses: actions/checkout@v5
      - name: Prepare
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Execute
        uses: ./.github/actions/task
        env:
          A: ${{ secrets.GOMAMAM_EMAIL }}
          B: ${{ secrets.GOMAMAM_PASSWORD }}
          C: ${{ secrets.GOMAMAM_MERCHANT }}
